name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Repo, showcase and privacy gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify models, page, links and privacy
        run: python3 tools/verify_repo.py
      - name: Check spec citations against the source
        run: python3 tools/spec_check.py --all --fails
      - name: Syntax-check site and tool scripts
        run: |
          node --check docs/site.js
          node --check tools/serve_docs.js
          python3 -m py_compile tools/*.py pipeline/*.py
